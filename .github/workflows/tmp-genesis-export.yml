name: Temporary GENESIS artifact transfer
on:
  pull_request:
    branches: [tmp-genesis-artifact-base]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify embedded dataset
        run: |
          test -s tmp_genesis_export/embedded_data.json
          python - <<'PY'
          import json
          p='tmp_genesis_export/embedded_data.json'
          d=json.load(open(p,encoding='utf-8'))
          assert len(d)==3507, len(d)
          assert len({x['code'] for x in d})==15
          print(len(d))
          PY
      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-embedded-data
          path: tmp_genesis_export/embedded_data.json
          if-no-files-found: error
          retention-days: 1
