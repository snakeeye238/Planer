name: Temporary GENESIS export
on:
  push:
    branches: [tmp-genesis-data-export]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-genesis-data-export
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Capture GENESIS browser requests
        run: |
          rm -rf tmp_genesis_export
          mkdir -p tmp_genesis_export
          cat > /tmp/capture.py <<'PY'
          import asyncio,json,os
          from playwright.async_api import async_playwright
          async def main():
            events=[]
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              context=await browser.new_context(viewport={'width':1600,'height':1000},accept_downloads=True,locale='de-DE')
              page=await context.new_page()
              def on_req(r):
                if any(x in r.url.lower() for x in ['/api/','61211','table','download','structure','data']):
                  events.append({'kind':'request','method':r.method,'url':r.url,'post_data':r.post_data,'headers':dict(r.headers)})
              async def on_resp(r):
                if any(x in r.url.lower() for x in ['/api/','61211','table','download','structure','data']):
                  rec={'kind':'response','status':r.status,'url':r.url,'headers':dict(r.headers)}
                  try:
                    b=await r.body()
                    rec['length']=len(b)
                    rec['body_head']=b[:3000].decode('utf-8','replace')
                  except Exception as e: rec['body_error']=repr(e)
                  events.append(rec)
              page.on('request',on_req)
              page.on('response',on_resp)
              url='https://genesis.destatis.de/datenbank/online/statistic/61211/table/61211-0003/table-toolbar'
              await page.goto(url,wait_until='domcontentloaded',timeout=180000)
              await page.wait_for_timeout(20000)
              open('tmp_genesis_export/body.txt','w').write(await page.locator('body').inner_text())
              open('tmp_genesis_export/page.html','w').write(await page.content())
              await page.screenshot(path='tmp_genesis_export/page.png',full_page=True)
              open('tmp_genesis_export/network.json','w').write(json.dumps(events,ensure_ascii=False,indent=2))
              open('tmp_genesis_export/storage.json','w').write(json.dumps({'local':await page.evaluate('Object.assign({}, localStorage)'),'session':await page.evaluate('Object.assign({}, sessionStorage)'),'cookies':await context.cookies()},ensure_ascii=False,indent=2))
              await browser.close()
          asyncio.run(main())
          PY
          python /tmp/capture.py
      - name: Commit capture
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp_genesis_export
          git commit -m "Temporary: capture GENESIS browser requests" || exit 0
          git push origin HEAD:tmp-genesis-data-export
