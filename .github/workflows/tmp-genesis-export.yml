name: Temporary GENESIS export
on:
  push:
    branches: [tmp-genesis-data-export]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-genesis-data-export
      - name: Inspect frontend service chunks
        run: |
          rm -rf tmp_genesis_export
          mkdir -p tmp_genesis_export/chunks
          python - <<'PY'
          import requests,json,re,os
          origin='https://genesis.destatis.de'
          chunks=['ServicesApi-c7hB3tCd.js','TableService-Fr8UZoVm.js','StatisticTablePage-Cy7O1ovX.js']
          out=[]
          for name in chunks:
            u=origin+'/datenbank/online/assets/'+name
            r=requests.get(u,timeout=180,headers={'User-Agent':'Mozilla/5.0'})
            text=r.text
            open('tmp_genesis_export/chunks/'+name,'w').write(text)
            rec={'name':name,'status':r.status_code,'length':len(r.content),'urls':sorted(set(re.findall(r'https?://[^"\'\s]+',text)))}
            rec['snippets']=[]
            for term in ['/api/rest','basePath','BASE_PATH','baseURL','download/','getTableData','initialStateJST','TableService']:
              start=0
              while True:
                i=text.find(term,start)
                if i<0: break
                rec['snippets'].append({'term':term,'pos':i,'text':text[max(0,i-500):i+1200]})
                start=i+len(term)
                if sum(1 for x in rec['snippets'] if x['term']==term)>=20: break
            out.append(rec)
          open('tmp_genesis_export/chunk_inspection.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tmp_genesis_export
          git commit -m "Temporary: inspect GENESIS service chunks" || exit 0
          git push origin HEAD:tmp-genesis-data-export
